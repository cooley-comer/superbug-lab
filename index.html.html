function dishSVG(left,right,label){

  return "<svg viewBox='0 0 120 120' width='120' height='120' role='img' aria-label='"+esc(label)+"'>"+
    "<circle cx='60' cy='60' r='56' fill='var(--dish)' stroke='var(--line)' stroke-width='3'/>"+

}

  var pts=[[40,36],[56,52],[72,38],[48,70],[66,78],[82,62],[60,26],[34,60],[78,88]],out="";
  pts.forEach(function(p){out+="<circle cx='"+p[0]+"' cy='"+p[1]+"' r='4' fill='#d9b36b'/>"});
  return "<svg viewBox='0 0 120 120' width='120' height='120' role='img' aria-label='"+esc(label)+"'><circle cx='60' cy='60' r='56' fill='var(--dish)' stroke='var(--line)' stroke-width='3'/>"+out+"</svg>";
}

/* ---------------- simulation ---------------- */
function newSim(mode){return {b:13,y:6,r:1,rows:[{t:0,b:13,y:6,r:1,roll:null,took:null}],log:"",mode:mode||S.mode||"random"}}
function simTotal(s){return s.b+s.y+s.r}
function simDone(s){return s.rows.length-1>=8||simTotal(s)===0}
function doRoll(){
  var s=S.sim;if(!s||simDone(s))return;
  var roll=s.mode==="perfect"?[1,3,5,6][Math.floor(Math.random()*4)]:1+Math.floor(Math.random()*6);
  var took=[1,3,5,6].indexOf(roll)>=0,rem=0;
  if(took){var n=5;var d=Math.min(s.b,n);s.b-=d;n-=d;d=Math.min(s.y,n);s.y-=d;n-=d;d=Math.min(s.r,n);s.r-=d;n-=d;rem=5-n}
  var add=0;if(s.b>0){s.b++;add++}if(s.y>0){s.y++;add++}if(s.r>0){s.r++;add++}
  s.rows.push({t:s.rows.length,b:s.b,y:s.y,r:s.r,roll:roll,took:took});
  var t=T();
  s.log=DICE[roll-1]+" "+roll+" → "+(took?t.taken+": "+t.removed+" "+rem:t.forgot+": "+t.removed+" 0")+" · "+t.added+" "+add;
  saveState();renderSim();renderScore();
}
function saveRun(){
  var s=S.sim;if(!s||!simDone(s))return;
  var last=s.rows[s.rows.length-1];
  S.runs.push({mode:s.mode,rows:s.rows,end:[last.b,last.y,last.r,last.b+last.y+last.r]});
  S.sim=newSim(S.mode);saveState();renderSim();renderScore();renderRuns();
}

function chartSVG(rows){
  var W=480,H=260,L=44,R=12,Tp=14,B=44,max=25;
  rows.forEach(function(r){max=Math.max(max,r.b+r.y+r.r)});max=Math.ceil(max/5)*5;
  function X(i){return L+i*(W-L-R)/8}function Y(v){return H-B-v*(H-B-Tp)/max}
  var t=T(),g="";
  for(var v=0;v<=max;v+=5){g+="<line x1='"+L+"' x2='"+(W-R)+"' y1='"+Y(v)+"' y2='"+Y(v)+"' stroke='var(--line)'/><text x='"+(L-6)+"' y='"+(Y(v)+4)+"' font-size='11' text-anchor='end' fill='var(--muted)'>"+v+"</text>"}
  for(var i=0;i<=8;i++){g+="<text x='"+X(i)+"' y='"+(H-B+16)+"' font-size='11' text-anchor='middle' fill='var(--muted)'>"+i+"</text>"}
  function line(key,col,dash){
    var p=rows.map(function(r,i){var v=key==="t"?r.b+r.y+r.r:r[key];return X(i)+","+Y(v)}).join(" ");
    var dots=rows.map(function(r,i){var v=key==="t"?r.b+r.y+r.r:r[key];return "<circle cx='"+X(i)+"' cy='"+Y(v)+"' r='3.5' fill='"+col+"'/>"}).join("");
    return "<polyline points='"+p+"' fill='none' stroke='"+col+"' stroke-width='2.5' "+(dash?"stroke-dasharray='6 4'":"")+"/>"+dots}
  return "<svg viewBox='0 0 "+W+" "+H+"' width='100%' role='img' aria-label='"+esc(t.graphT)+"'>"+g+
    "<text x='"+((L+W-R)/2)+"' y='"+(H-6)+"' font-size='12' text-anchor='middle' fill='var(--ink)'>"+esc(t.gx)+"</text>"+
    "<text transform='translate(12 "+((H-B)/2)+") rotate(-90)' font-size='12' text-anchor='middle' fill='var(--ink)'>"+esc(t.gy)+"</text>"+
    line("b","var(--blue)")+line("y","var(--yellow)")+line("r","var(--red)")+line("t","var(--ink)",true)+"</svg>";
}
function dotsHTML(n,c){var h="";for(var i=0;i<n;i++)h+="<i style='background:"+c+"'></i>";return h||"<span class='small'>0</span>"}

/* ---------------- scoring ---------------- */
function predScore(){var n=0;["I","II"].forEach(function(k){for(var i=0;i<4;i++){var v=S.pred[k+i];if(S.predChecked&&v===(TRUTH[k][i]?"1":"0"))n++}});return n}
function mcScore(){var n=0;T().mcs.forEach(function(m,i){if(S.mc["m"+i]===String(m.a)&&S.mcChecked["m"+i])n++});return n}
function simScore(){return (S.runs.length>=1?3:0)+(S.runs.length>=2?2:0)}
var GROUPS=[{terms:[0,1,2],order:[1,2,0]},{terms:[3,4,5],order:[5,3,4]}];
function matchScore(){var n=0;if(!S.matchChecked)return 0;for(var i=0;i<6;i++){if(S.match["t"+i]===String(i))n++}return n}
function scScore(){var n=0;T().scs.forEach(function(x,i){if(S.scChecked["sc"+i]&&S.sc["sc"+i]===String(x.a))n++});return n}
function autoTotal(){return predScore()+mcScore()+simScore()+matchScore()+scScore()}

/* ---------------- render ---------------- */
function $(id){return document.getElementById(id)}
function render(){
  var t=T();document.documentElement.lang=S.lang;

  // PART 1
  h+="<section class='card' id='p1'><div class='partno'>1.2.3</div><h2>"+esc(t.p1h)+"<span class='pill'>"+esc(t.p1pts)+"</span></h2><p>"+esc(t.p1intro)+"</p>";
  h+="<div class='scroll'><table><tr><th></th><th>"+esc(t.colI)+"</th><th>"+esc(t.colII)+"</th></tr>";
  t.plates.forEach(function(pl,i){
    h+="<tr><td style='text-align:left'><b>"+esc(pl)+"</b></td>";
    ["I","II"].forEach(function(k){
      var v=S.pred[k+i]||"",mark="";
      if(S.predChecked&&v!==""){mark=(v===(TRUTH[k][i]?"1":"0"))?" <span class='ok'>✓</span>":" <span class='bad'>✗</span>"}
      h+="<td><select data-pred='"+k+i+"' aria-label='"+esc(pl+" "+(k==="I"?t.colI:t.colII))+"'><option value=''>"+esc(t.sel[0])+"</option><option value='1'"+(v==="1"?" selected":"")+">"+esc(t.sel[1])+"</option><option value='0'"+(v==="0"?" selected":"")+">"+esc(t.sel[2])+"</option></select>"+mark+"</td>"});
    h+="</tr>"});
  h+="</table></div><p><button class='btn' id='chkP'>"+esc(t.check)+"</button> "+(S.predChecked?"<b>"+esc(t.pcore)+": "+predScore()+" / 8</b>":"")+"</p>";
  if(S.predChecked){
    h+="<div class='plates'>";
    t.plates.forEach(function(pl,i){h+="<div class='plate'>"+dishSVG(TRUTH.I[i],TRUTH.II[i],pl)+"<div>"+esc(pl)+"</div></div>"});
    h+="</div><p><button class='btn alt' id='mateB'>"+esc(t.reveal)+"</button></p>";
  }
  if(S.predChecked&&S.mated){
    h+="<div class='info'><h3>"+esc(t.matedH)+"</h3><p>"+esc(t.matedP)+"</p><div class='plates'>";
    [[1,"LB + "+(S.lang==="es"?"estreptomicina":"streptomycin")],[2,"LB + "+(S.lang==="es"?"ampicilina":"ampicillin")],[3,t.plates[3]]].forEach(function(p){h+="<div class='plate'>"+mixedSVG(p[1])+"<div>"+esc(p[1])+"</div><div class='ok'>"+esc(t.growth)+"</div></div>"});
    h+="</div><p><b>"+esc(t.matedNote)+"</b></p></div>";
  }
  h+=qBox("q1",t.qA,t.qAt)+qBox("q2",t.qB,t.qBt)+"</section>";

  // PART 2
  h+="<section class='card' id='p2'><div class='partno'>1.2.4</div><h2>"+esc(t.p2h)+"<span class='pill'>"+esc(t.p2pts)+"</span></h2><p>"+esc(t.p2intro)+"</p><ol>"+t.rules.map(function(r){return "<li>"+esc(r)+"</li>"}).join("")+"</ol>";
  h+="<div id='simBox'></div><div id='runsBox'></div>";
  h+=qBox("q3",t.qC,t.qCt)+qBox("q4",t.qD,t.qDt)+"</section>";

  // PART 3
  h+="<section class='card' id='p3'><div class='partno'>1.2.3 + 1.2.4</div><h2>"+esc(t.p3h)+"<span class='pill'>"+esc(t.p3pts)+"</span></h2>";
  t.mcs.forEach(function(m,i){
    var key="m"+i,sel=S.mc[key],chk=S.mcChecked&&S.mcChecked[key];
    h+="<div class='mc'><label class='q'>"+(i+1)+". "+esc(m.q)+"</label>";
    m.o.forEach(function(o,j){
      var cls="";if(chk){if(j===m.a)cls="right";else if(String(j)===sel)cls="wrong"}
      h+="<label class='"+cls+"'><input type='radio' name='"+key+"' value='"+j+"' "+(sel===String(j)?"checked":"")+(chk?" disabled":"")+"> "+esc(o)+"</label>"});
    h+="</div>"});
  h+="</section>";

  // PART 4
  h+="<section class='card' id='p4'><div class='partno'>1.2.3 + 1.2.4</div><h2>"+esc(t.p4h)+"<span class='pill'>"+esc(t.p4pts)+"</span></h2>"+qBox("q5",t.qE,t.qEt)+"</section>";

  h+=part56(t);
  h+="<section class='card'><p>"+esc(t.teacher)+"</p><p><button class='btn' id='dlB'>"+esc(t.dl)+"</button> <button class='btn alt' id='cpB'>"+esc(t.copy)+"</button> <button class='btn alt' id='clrB'>"+esc(t.resetAll)+"</button></p><p class='small' id='dlMsg'></p></section>";
  $("app").innerHTML=h;
  if(!S.sim)S.sim=newSim(S.mode);
  renderSim();renderRuns();renderScore();bind();
}
function part56(t){
  var h="<section class='card' id='p5'><div class='partno'>1.2.3</div><h2>"+esc(t.p5h)+"<span class='pill'>"+esc(t.p5pts)+"</span></h2><p>"+esc(t.p5intro)+"</p>";
  GROUPS.forEach(function(g,gi){
    h+="<h3>"+esc(gi?t.g2:t.g1)+"</h3>";
    g.terms.forEach(function(ti){
      var k="t"+ti,v=S.match[k]||"",mark="";
      if(S.matchChecked&&v!=="")mark=(v===String(ti))?" <span class='ok'>✓</span>":" <span class='bad'>✗</span>";
      h+="<label class='q' for='m_"+k+"'>"+esc(t.mterms[ti])+mark+"</label><select id='m_"+k+"' data-match='"+k+"'><option value=''>"+esc(t.sel[0])+"</option>";
      g.order.forEach(function(di){h+="<option value='"+di+"'"+(v===String(di)?" selected":"")+">"+esc(t.mdefs[di])+"</option>"});
      h+="</select>"});
  });
  h+="<p><button class='btn' id='chkM'>"+esc(t.checkM)+"</button> "+(S.matchChecked?"<b>"+esc(t.mcorrect)+": "+matchScore()+" / 6</b>":"")+"</p></section>";
  h+="<section class='card' id='p6'><div class='partno'>1.2.4</div><h2>"+esc(t.p6h)+"<span class='pill'>"+esc(t.p6pts)+"</span></h2><p>"+esc(t.p6intro)+"</p>";
  t.scs.forEach(function(x,i){
    var key="sc"+i,sel=S.sc[key],chk=S.scChecked[key];
    h+="<div class='mc'><label class='q'>"+(i+1)+". "+esc(x.q)+"</label>";
    [t.smart,t.risky].forEach(function(o,j){
      var cls="";if(chk){if(j===x.a)cls="right";else if(String(j)===sel)cls="wrong"}
      h+="<label class='"+cls+"'><input type='radio' name='"+key+"' value='"+j+"' "+(sel===String(j)?"checked":"")+(chk?" disabled":"")+"> "+esc(o)+"</label>"});
    if(chk)h+="<div class='info'>"+esc(x.f)+"</div>";
    h+="</div>"});
  h+=qBox("q6",t.qF,t.qFt)+"</section>";
  return h;
}
function qBox(id,label,text){
  return "<label class='q' for='"+id+"'>"+esc(label)+"<br><span style='font-weight:400'>"+esc(text)+"</span></label><textarea id='"+id+"' data-q='"+id+"' placeholder='"+esc(T().type)+"'>"+esc(S.q[id]||"")+"</textarea>";
}
function renderSim(){
  var box=$("simBox");if(!box)return;var t=T(),s=S.sim,done=simDone(s),last=s.rows[s.rows.length-1];
  var h="<div class='info'><label><input type='radio' name='mode' value='random' "+(s.mode==="random"?"checked":"")+(s.rows.length>1?" disabled":"")+"> "+esc(t.mode1)+"</label> &nbsp; <label><input type='radio' name='mode' value='perfect' "+(s.mode==="perfect"?"checked":"")+(s.rows.length>1?" disabled":"")+"> "+esc(t.mode2)+"</label></div>";
  h+="<div class='simrow'><div>";
  h+="<div class='legend'><span style='--c:var(--blue)'>"+esc(t.blue)+": "+last.b+"</span><span style='--c:var(--yellow)'>"+esc(t.yellow)+": "+last.y+"</span><span style='--c:var(--red)'>"+esc(t.red)+": "+last.r+"</span></div>";
  h+="<div class='dots'>"+dotsHTML(last.b,"var(--blue)")+dotsHTML(last.y,"var(--yellow)")+dotsHTML(last.r,"var(--red)")+"</div>";
  h+="<p><button class='btn' id='rollB' "+(done?"disabled":"")+">"+esc(t.roll)+"</button> <span class='dice' aria-hidden='true'>"+(last.roll?DICE[last.roll-1]:"🎲")+"</span></p>";
  h+="<div class='log' aria-live='polite'>"+esc(s.log||"")+(done?"<br><b>"+esc(t.runDone)+"</b>":"")+"</div>";
  h+="<p><button class='btn alt' id='saveRunB' "+(done?"":"disabled")+">"+esc(t.newrun)+"</button> <button class='btn alt' id='resetB'>"+esc(t.reset)+"</button></p>";
  h+="</div><div>"+chartSVG(s.rows)+"<div class='legend'><span style='--c:var(--blue)'>"+esc(t.blue)+"</span><span style='--c:var(--yellow)'>"+esc(t.yellow)+"</span><span style='--c:var(--red)'>"+esc(t.red)+"</span><span style='--c:var(--ink)'>"+esc(t.total)+"</span></div></div></div>";
  h+="<div class='scroll'><table><tr><th>"+esc(t.tossN)+"</th><th>🎲</th><th>"+esc(t.blue)+"</th><th>"+esc(t.yellow)+"</th><th>"+esc(t.red)+"</th><th>"+esc(t.total)+"</th></tr>";
  s.rows.forEach(function(r,i){h+="<tr><td>"+(i===0?esc(t.initial):i)+"</td><td>"+(r.roll?r.roll:"–")+"</td><td>"+r.b+"</td><td>"+r.y+"</td><td>"+r.r+"</td><td>"+(r.b+r.y+r.r)+"</td></tr>"});
  h+="</table></div>";
  box.innerHTML=h;
  var rb=$("rollB");if(rb)rb.onclick=doRoll;
  var sb=$("saveRunB");if(sb)sb.onclick=saveRun;
  var rs=$("resetB");if(rs)rs.onclick=function(){S.sim=newSim(S.mode);saveState();renderSim()};
  Array.prototype.forEach.call(box.querySelectorAll("input[name=mode]"),function(el){el.onchange=function(){S.mode=el.value;S.sim=newSim(S.mode);saveState();renderSim()}});
}
function renderRuns(){
  var box=$("runsBox");if(!box)return;var t=T();
  if(!S.runs.length){box.innerHTML="";return}
  var h="<div class='info'><h3>"+esc(t.runs)+"</h3><div class='scroll'><table><tr><th>#</th><th></th><th>"+esc(t.runEnd)+"</th></tr>";
  S.runs.forEach(function(r,i){h+="<tr><td>"+(i+1)+"</td><td>"+esc(t.runMode[r.mode==="perfect"?1:0])+"</td><td>"+r.end.join(" / ")+"</td></tr>"});
  h+="</table></div></div>";box.innerHTML=h;
}
function renderScore(){
  var t=T();
  $("scorebar").innerHTML="<span><b>"+esc(t.earned)+": "+autoTotal()+"</b> "+esc(t.ofAuto)+"</span><span class='small'>"+esc(t.simpts)+": "+simScore()+" / 5</span>";
}

/* ---------------- events ---------------- */
function bind(){
  $("nm").oninput=function(e){S.name=e.target.value;saveState()};
  $("pd").oninput=function(e){S.period=e.target.value;saveState()};
  Array.prototype.forEach.call(document.querySelectorAll("textarea[data-q]"),function(el){el.oninput=function(){S.q[el.dataset.q]=el.value;saveState()}});
  Array.prototype.forEach.call(document.querySelectorAll("select[data-pred]"),function(el){el.onchange=function(){S.pred[el.dataset.pred]=el.value;S.predChecked=false;saveState();render()}});
  var c=$("chkP");if(c)c.onclick=function(){S.predChecked=true;saveState();render();location.hash="#p1"};
  var m=$("mateB");if(m)m.onclick=function(){S.mated=true;saveState();render()};
  S.mcChecked=S.mcChecked||{};
  Array.prototype.forEach.call(document.querySelectorAll(".mc input[type=radio]"),function(el){el.onchange=function(){S.mc[el.name]=el.value;S.mcChecked[el.name]=true;saveState();render()}});
 Array.prototype.forEach.call(document.querySelectorAll("select[data-match]"),function(el){el.onchange=function(){S.match[el.dataset.match]=el.value;S.matchChecked=false;saveState();render()}});
  var cm=$("chkM");if(cm)cm.onclick=function(){S.matchChecked=true;saveState();render();location.hash="#p5"};
  Array.prototype.forEach.call(document.querySelectorAll("input[name^=sc]"),function(el){el.onchange=function(){S.sc[el.name]=el.value;S.scChecked[el.name]=true;saveState();render()}});
  $("dlB").onclick=doDownload;$("cpB").onclick=doCopy;
  $("clrB").onclick=function(){if(confirm(T().confirmClear)){S={lang:S.lang,name:"",period:"",pred:{},predChecked:false,mated:false,q:{},mc:{},mcChecked:{},match:{},matchChecked:false,sc:{},scChecked:{},sim:null,runs:[],mode:"random"};saveState();render()}};
}
$("lEN").onclick=function(){S.lang="en";saveState();render()};
$("lES").onclick=function(){S.lang="es";saveState();render()};

/* ---------------- export ---------------- */
function report(){
  var t=T(),L=[];
  L.push(t.title);L.push(t.name+": "+S.name+"   "+t.period+": "+S.period);L.push("");
  L.push("PART 1 — "+t.pcore+": "+predScore()+" / 8");
  ["I","II"].forEach(function(k){t.plates.forEach(function(pl,i){var v=S.pred[k+i];L.push("  "+(k==="I"?t.colI:t.colII)+" | "+pl+": "+(v===""||v==null?"—":(v==="1"?t.sel[1]:t.sel[2])))})});
  L.push("");L.push(t.qA+": "+t.qAt);L.push(S.q.q1||"");L.push("");L.push(t.qB+": "+t.qBt);L.push(S.q.q2||"");L.push("");
  L.push("PART 2 — "+t.runs);
  S.runs.forEach(function(r,i){L.push("  Run "+(i+1)+" ("+t.runMode[r.mode==="perfect"?1:0]+"): "+r.end.join(" / "));r.rows.forEach(function(x,j){L.push("    "+j+": "+x.b+" / "+x.y+" / "+x.r+" = "+(x.b+x.y+x.r))})});
  L.push("");L.push(t.qC+": "+t.qCt);L.push(S.q.q3||"");L.push("");L.push(t.qD+": "+t.qDt);L.push(S.q.q4||"");L.push("");
  L.push("PART 3");t.mcs.forEach(function(m,i){var v=S.mc["m"+i];L.push("  "+(i+1)+". "+(v==null?"—":m.o[+v])+(v!=null?(+v===m.a?" ✓":" ✗"):""))});
  L.push("");L.push("PART 4");L.push(t.qE+": "+t.qEt);L.push(S.q.q5||"");L.push("");
  L.push("");L.push("PART 5 — "+t.mcorrect+": "+matchScore()+" / 6");
  t.mterms.forEach(function(m,i){var v=S.match["t"+i];L.push("  "+m+" → "+(v===""||v==null?"—":t.mdefs[+v])+(S.matchChecked&&v!==""&&v!=null?(v===String(i)?" ✓":" ✗"):""))});
  L.push("");L.push("PART 6");t.scs.forEach(function(x,i){var v=S.sc["sc"+i];L.push("  "+(i+1)+". "+x.q+" → "+(v==null?"—":(+v?t.risky:t.smart)))});
  L.push(t.qF+": "+t.qFt);L.push(S.q.q6||"");L.push("");
  L.push(t.earned+": "+autoTotal()+" "+t.ofAuto);
  return L.join("\n");
}
function doDownload(){
  var msg=$("dlMsg");
  var fnm="Superbug_Lab_"+(S.name||"student").replace(/[^A-Za-z0-9_-]+/g,"_")+".txt";
  if(!(window.claude&&claude.use)){
    try{var bl=new Blob([report()],{type:"text/plain"}),a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=fnm;document.body.appendChild(a);a.click();document.body.removeChild(a);msg.textContent=""}catch(e){msg.textContent=T().dlfail}
    return}
  claude.use("downloads").then(function(d){
    if(!d){msg.textContent=T().dlfail;return}
    var fn="Superbug_Lab_"+(S.name||"student").replace(/[^A-Za-z0-9_-]+/g,"_")+".txt";
    return d.save({filename:fn,data:report()}).then(function(){msg.textContent=""},function(){msg.textContent=T().dlfail});
  }).catch(function(){msg.textContent=T().dlfail});
}
function doCopy(){
  var msg=$("dlMsg"),txt=report();
  function fallback(){var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");msg.textContent=T().copied}catch(e){msg.textContent=T().dlfail}document.body.removeChild(ta)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){msg.textContent=T().copied},fallback)}else fallback();
}
